name: Deploy Tagged Version

on:
    push:
        tags:
            - "v*"

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            PUBLIC_URL: "https://www.leanprover.cn/reference-manual/latest/"
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Configure Git
              run: |
                  git config --global user.name "github-actions[bot]"
                  git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Prepare build environment
              run: ./deploy/prep.sh

            - name: Install elan
              run: |
                  set -o pipefail
                  curl -sSfL https://github.com/leanprover/elan/releases/download/v4.2.2/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
                  ./elan-init -y --default-toolchain none
                  echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

            - name: Lean version
              run: lean --version

            - name: Determine Lean manual version
              run: |
                  VERSION=$(lean --version | sed -E 's/^.*version[[:space:]]+([^,]+).*/\1/')
                  test -n "$VERSION"
                  if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
                      test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
                          echo "Tag ${GITHUB_REF_NAME} does not match Lean version v${VERSION}" >&2
                          exit 1
                      }
                  fi
                  echo "VERSION=$VERSION" >> "$GITHUB_ENV"
                  echo "Publishing Lean $VERSION to $PUBLIC_URL"

            - name: Restore Lake cache
              uses: actions/cache/restore@v4
              with:
                  path: |
                      .lake/packages
                      .lake/build/bin
                      .lake/build/ir
                      .lake/build/lib
                  key: ${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('lakefile.lean') }}-${{ github.sha }}
                  restore-keys: |
                      ${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('lakefile.lean') }}
                      ${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-

            # Keep an explicit build check before generation and deployment.
            - name: Build and check
              run: ./deploy/build.sh

            - name: Save Lake cache
              uses: actions/cache/save@v4
              with:
                  path: |
                      .lake/packages
                      .lake/build/bin
                      .lake/build/ir
                      .lake/build/lib
                  key: ${{ runner.os }}-${{ hashFiles('lean-toolchain') }}-${{ hashFiles('lake-manifest.json') }}-${{ hashFiles('lakefile.lean') }}-${{ github.sha }}

            - name: Generate production HTML
              run: ./deploy/generate.sh

            - name: Update deploy branch
              run: |
                  test -d html/site/reference
                  python deploy/release.py html/site/reference "$VERSION" "$GITHUB_SHA" deploy

            - name: Push deploy branch to Lean-zh/reference-manual
              run: git push origin deploy
